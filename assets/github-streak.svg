<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub contribution streak: 26,558 total, 45 day current streak, 858 day longest streak">
  <style>
    :root { --bg: #ffffff; --border: #d0d7de; --text: #24292f; --muted: #57606a; --accent: #0969da; --fire: #d9480f; --track: #e6e9ed; }
    @media (prefers-color-scheme: dark) {
