name: Update README

# Refreshes the auto-generated README sections and images (GitHub stats and
# streak cards, Steam games, most played artists, WakaTime languages, recent
# repositories, latest blog posts) and commits the result to main.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run script tests
        run: node --test "scripts/**/*.test.mjs"

      - name: Refresh README sections
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/)" ]; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "Update README sections (artists, repos, blog)"
          git push origin HEAD:main
